name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Dummy value -- signing access tokens is the only thing that reads this
  # in a way that matters for typecheck/lint/test, and none of those need a
  # real secret.
  JWT_ACCESS_SECRET: ci-test-secret-not-for-production
  # Every job triggers apps/api's postinstall (pnpm install runs it for the
  # whole workspace, not just jobs that filter to @booklet/api) -- prisma
  # generate resolves DATABASE_URL just to load prisma.config.ts, even
  # though pure codegen never connects. Jobs that actually need a real
  # database (test-api, test-web-e2e, test-extension-e2e) set their own
  # job-level DATABASE_URL, which overrides this.
  DATABASE_URL: postgresql://user:password@localhost:5432/db?schema=public

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @booklet/shared build
      - run: pnpm --filter @booklet/api exec tsc --noEmit
      - run: pnpm --filter @booklet/web exec tsc --noEmit
      - run: pnpm --filter @booklet/web lint
      - run: pnpm --filter @booklet/extension exec tsc --noEmit
      - run: pnpm --filter @booklet/mobile exec tsc --noEmit

  test-shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @booklet/shared test

  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booklet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booklet?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A real Postgres service container, unlike the pglite dev database
      # this repo also supports -- so the normal Prisma migration engine
      # (which doesn't reliably talk to pglite, see apps/api/README notes)
      # works fine here.
      - run: pnpm --filter @booklet/api exec prisma migrate deploy
      - run: pnpm --filter @booklet/api test

  test-web-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booklet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booklet?schema=public
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      # Lets the API fetch the e2e fixture server on 127.0.0.1 instead of
      # every article-saving spec hitting the real internet. Guarded in
      # extraction-service.ts so it is ignored outright when
      # NODE_ENV=production -- the SSRF protection it relaxes is not
      # overridable where it matters.
      EXTRACTION_ALLOW_PRIVATE_ADDRESSES: "true"
      # The whole suite hits the API from one address in a couple of minutes,
      # which is precisely the pattern the default limit is meant to catch.
      # Without this it trips partway through and fails a spec that has
      # nothing wrong with it.
      GLOBAL_RATE_LIMIT_MAX: "100000"
      TTS_RATE_LIMIT_MAX: "100000"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @booklet/api exec prisma migrate deploy
      - run: pnpm --filter @booklet/web exec playwright install --with-deps chromium
      - run: pnpm --filter @booklet/api dev &
      - run: pnpm --filter @booklet/web dev &
      - name: Wait for API and web to be ready
        run: |
          npx wait-on http://localhost:4000/api/health http://localhost:3000 --timeout 60000
      # Playwright starts the article fixture server itself (see
      # playwright.config.ts's webServer). One spec, save-real-url.spec.ts,
      # still fetches a genuine public URL so real-world extraction stays
      # covered -- if outbound network is ever restricted for this runner,
      # exclude it with `--grep-invert @live` rather than dropping the whole
      # job and losing everything else with it.
      - run: pnpm --filter @booklet/web test:e2e

  bench-tts-ttfa:
    # One-off: measures real Kokoro TTFA (cold pool, warm/uncached, cache
    # hit, concurrent chunks, prewarm head-start) -- see
    # apps/api/scripts/bench-tts-ttfa.ts. Needs real network access to fetch
    # Kokoro's weights from Hugging Face, and no Postgres -- the TTS
    # pipeline itself never touches the database.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fetch the model once, in a single process, before the pool starts.
      # Without this the benchmark's three worker processes all cold-miss the
      # Hugging Face cache simultaneously and race writing the same file --
      # observed producing a truncated model and a "Protobuf parsing failed"
      # crash, not merely wasted bandwidth. The Docker image avoids this by
      # baking the weights in at build time (see apps/api/Dockerfile); this
      # job runs tsx directly, so it needs the equivalent step.
      - run: node apps/api/scripts/prefetch-tts-model.mjs
      - run: pnpm --filter @booklet/api exec tsx scripts/bench-tts-ttfa.ts

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build only, no push -- this is here to catch exactly the kind of
      # thing that can't be caught by typecheck/lint/test: the production
      # build+run path (tsc/esbuild -> plain `node dist/index.js`, no tsx
      # or bundler doing module resolution favors at runtime) is a
      # different execution environment than dev or these other CI jobs,
      # and has broken silently before (see apps/api/scripts/build.mjs and
      # schema.prisma's importFileExtension for what that looked like).
      - run: docker build -f apps/api/Dockerfile -t booklet-api .
      - run: docker build -f apps/web/Dockerfile -t booklet-web .
      # Actually start the api image against a real throwaway Postgres and
      # hit its health route -- confirms the built image doesn't just exist,
      # it boots and Prisma actually connects.
      - name: Smoke-test the built API image
        run: |
          docker network create booklet-ci
          docker run -d --name booklet-postgres --network booklet-ci \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=booklet \
            postgres:16
          for i in $(seq 1 30); do
            docker exec booklet-postgres pg_isready -U postgres && break
            sleep 2
          done
          docker run -d --name booklet-api --network booklet-ci -p 4000:4000 \
            -e DATABASE_URL="postgresql://postgres:postgres@booklet-postgres:5432/booklet?schema=public" \
            -e JWT_ACCESS_SECRET=ci-test-secret-not-for-production \
            -e WEB_ORIGIN=http://localhost:3000 \
            booklet-api \
            sh -c "pnpm --filter @booklet/api exec prisma migrate deploy && node apps/api/dist/index.js"
          npx wait-on http://localhost:4000/api/health --timeout 60000
          curl -sf http://localhost:4000/api/health
          docker logs booklet-api

  test-extension-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booklet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booklet?schema=public
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @booklet/api exec prisma migrate deploy
      - run: pnpm --filter @booklet/extension build
      # Mozilla's own manifest validator -- catches Firefox-specific
      # manifest.json regressions (an unsupported strict_min_version for a
      # key actually in use, a missing required key like
      # data_collection_permissions) that nothing else here would, since
      # the e2e suite below only runs against Chromium.
      - run: pnpm --filter @booklet/extension lint:firefox
      - run: pnpm --filter @booklet/extension exec playwright install --with-deps chromium
      # Loading a real extension needs an actual background service worker,
      # which (confirmed empirically, see e2e/extension.spec.ts) doesn't
      # register under Chromium's headless mode -- xvfb gives it a real
      # display to run headed against, same trick used for any headed-only
      # browser suite on a runner with no physical display.
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: pnpm --filter @booklet/api dev &
      - name: Wait for the API to be ready
        run: npx wait-on http://localhost:4000/api/health --timeout 60000
      - run: xvfb-run -a pnpm --filter @booklet/extension test:e2e
