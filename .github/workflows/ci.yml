# CI for Booklet.
#
# This is the one and only pipeline. It runs on a **self-hosted runner** --
# a machine you own, registered to this repository (see
# scripts/register-github-runner.sh and docs/CI_GITHUB_RUNNER.md). Self-hosted
# runner minutes are not metered or billed, which is the whole reason this
# repo is on one: GitHub-hosted minutes and GitLab's free tier both ran out
# mid-branch and left pushes unverified. There is no second (GitLab) pipeline
# to keep in sync anymore -- that was removed when the move happened.
#
# Because the runner is a persistent machine rather than a fresh VM per job,
# two things follow that a GitHub-hosted runner handled for free:
#   - It needs Docker (for the `services:` Postgres containers and the
#     docker-build job) and passwordless sudo (for the apt-get/xvfb steps),
#     provisioned once. docs/CI_GITHUB_RUNNER.md lists the prerequisites.
#   - One runner runs one job at a time, so the seven jobs serialize. Register
#     more runners (same script, same labels) to run them in parallel.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    # A commit that only touches prose ties the runner up for the same ~22
    # minutes as one that touches every app, and buys nothing -- there is no
    # code in it to typecheck, bundle, or drive a browser against. On a single
    # self-hosted runner that is 22 minutes the next real push has to wait for.
    # Note this means a docs-only PR reports *no* checks at all; if required
    # status checks are ever turned on for this repo, this needs to become a
    # no-op job rather than a skipped workflow, or such a PR can never merge.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  # So the benchmark (and a full run) can still be asked for by hand on a
  # branch, now that bench-tts-ttfa no longer runs on every PR push.
  workflow_dispatch:

# Superseded runs are cancelled instead of racing the new one to the finish.
# This mattered for billed minutes on a hosted runner; on a single self-hosted
# runner it matters more, not less -- five pushes in an afternoon would queue
# five full runs back to back, and the newest push (the only one anyone will
# read) would wait behind ~88 minutes of already-obsolete work. The final push
# on a branch still gets a complete run; only the ones already obsolete drop.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy value -- signing access tokens is the only thing that reads this
  # in a way that matters for typecheck/lint/test, and none of those need a
  # real secret.
  JWT_ACCESS_SECRET: ci-test-secret-not-for-production
  # Every job triggers apps/api's postinstall (pnpm install runs it for the
  # whole workspace, not just jobs that filter to @booklet/api) -- prisma
  # generate resolves DATABASE_URL just to load prisma.config.ts, even
  # though pure codegen never connects. Jobs that actually need a real
  # database (test-api, test-web-e2e, test-extension-e2e) set their own
  # job-level DATABASE_URL, which overrides this.
  DATABASE_URL: postgresql://user:password@localhost:5432/db?schema=public

jobs:
  typecheck-and-lint:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @booklet/shared build
      - run: pnpm --filter @booklet/api exec tsc --noEmit
      - run: pnpm --filter @booklet/web exec tsc --noEmit
      - run: pnpm --filter @booklet/web lint
      - run: pnpm --filter @booklet/extension exec tsc --noEmit
      - run: pnpm --filter @booklet/mobile exec tsc --noEmit
      # The production bundle, without waiting for a Docker layer to say so.
      # tsc resolves imports through node_modules and never asks who *declared*
      # a package, so importing a transitive dependency typechecks cleanly and
      # then fails in esbuild -- which is exactly how a direct
      # @huggingface/transformers import broke docker-build with "No loader is
      # configured for '.node' files" while every other job stayed green.
      # docker-build still covers the full build+run path; this just moves the
      # cheapest half of that signal ~2 minutes earlier.
      - run: pnpm --filter @booklet/api exec node scripts/build.mjs

  # Unit tests that need nothing but Node: @booklet/shared and apps/web.
  test-unit:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @booklet/shared test
      # apps/web's unit tests run here rather than in their own job: they need
      # no database, no browser and no built artifacts, and the whole suite is
      # ~2s -- a dedicated job would spend more time on checkout and install
      # than on the tests. See apps/web/vitest.config.ts for what they cover
      # and why the runner exists at all (#165).
      - run: pnpm --filter @booklet/shared build
      - run: pnpm --filter @booklet/web test

  test-api:
    runs-on: [self-hosted, linux, x64]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booklet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booklet?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A real Postgres service container, unlike the pglite dev database
      # this repo also supports -- so the normal Prisma migration engine
      # (which doesn't reliably talk to pglite, see apps/api/README notes)
      # works fine here.
      - run: pnpm --filter @booklet/api exec prisma migrate deploy
      - run: pnpm --filter @booklet/api test

  test-web-e2e:
    runs-on: [self-hosted, linux, x64]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booklet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booklet?schema=public
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      # Lets the API fetch the e2e fixture server on 127.0.0.1 instead of
      # every article-saving spec hitting the real internet. Guarded in
      # extraction-service.ts so it is ignored outright when
      # NODE_ENV=production -- the SSRF protection it relaxes is not
      # overridable where it matters.
      EXTRACTION_ALLOW_PRIVATE_ADDRESSES: "true"
      # The whole suite hits the API from one address in a couple of minutes,
      # which is precisely the pattern the default limit is meant to catch.
      # Without this it trips partway through and fails a spec that has
      # nothing wrong with it.
      GLOBAL_RATE_LIMIT_MAX: "100000"
      TTS_RATE_LIMIT_MAX: "100000"
      # The auth routes need the same treatment, for the same reason. The
      # suite signs up dozens of times and reloads pages hundreds of times,
      # all from one address -- against the real per-IP budgets it runs out
      # partway through and fails whichever spec happens to be next, which
      # reads as flakiness rather than as a limit doing its job. Raising them
      # here changes nothing about the shipped defaults.
      #
      # These were added to .gitlab-ci.yml when the limits landed (#169) and
      # never mirrored back here, because this workflow had already gone
      # dormant -- exactly the drift the header warns about.
      AUTH_ATTEMPT_RATE_LIMIT_MAX: "100000"
      AUTH_REFRESH_RATE_LIMIT_MAX: "100000"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @booklet/api exec prisma migrate deploy
      - run: pnpm --filter @booklet/web exec playwright install --with-deps chromium
      # Same reason as the bench job: the API's TTS workers would otherwise
      # all cold-miss the model cache at once and race writing it, which
      # produced a corrupt model and left read-aloud non-functional for the
      # whole run (tts-player.spec.ts timing out at 60s waiting for
      # playback). Fetch it once, single-process, first. The pool now also
      # stages its own cold start (#161); this stays because it additionally
      # warms the cache before the pool exists at all.
      - run: node apps/api/scripts/prefetch-tts-model.mjs
      - run: pnpm --filter @booklet/api dev &
      - run: pnpm --filter @booklet/web dev &
      - name: Wait for API and web to be ready
        run: |
          npx wait-on http://localhost:4000/api/health http://localhost:3000 --timeout 60000
      # Generate one small chunk before the suite starts, so the first TTS
      # spec doesn't pay the pool's cold start inside its own assertion
      # window. /api/health goes green while the pool is still spawning
      # workers and loading a model into each, and on a 2-vCPU runner
      # already busy with Next and Postgres that first generation can
      # exceed the 60s the spec allows -- which is exactly how it failed.
      # The second TTS spec passed in the same run, warm, which is what
      # identified this as cold start rather than a broken pipeline.
      # `|| true`: this is a warm-up, not a gate. If it fails the specs
      # will report it far more legibly than a bare curl exit code.
      - name: Warm the TTS pool
        run: |
          curl -sS -X POST http://localhost:4000/api/tts \
            -H 'Content-Type: application/json' \
            -d '{"text":"Warming up.","voice":"af_heart","speed":1}' \
            --max-time 180 -o /dev/null -w 'warm-up HTTP %{http_code} in %{time_total}s\n' || true
      # Playwright starts the article fixture server itself (see
      # playwright.config.ts's webServer). One spec, save-real-url.spec.ts,
      # still fetches a genuine public URL so real-world extraction stays
      # covered -- if outbound network is ever restricted for this runner,
      # exclude it with `--grep-invert @live` rather than dropping the whole
      # job and losing everything else with it. That exclusion is a genuine
      # offline switch: every spec that reaches the public internet carries
      # the tag (#167), which is also what `pnpm verify --e2e` relies on.
      - run: pnpm --filter @booklet/web test:e2e

  bench-tts-ttfa:
    # Measures real Kokoro TTFA (cold pool, warm/uncached, cache hit,
    # concurrent chunks, prewarm head-start) -- see
    # apps/api/scripts/bench-tts-ttfa.ts. Needs real network access to fetch
    # Kokoro's weights from Hugging Face, and no Postgres -- the TTS
    # pipeline itself never touches the database.
    #
    # Not run on pull requests. It is a measurement, not a gate: it has no
    # pass/fail criteria, so a PR author gains nothing from it blocking or
    # from reading it on every push, while it costs a runner every time.
    # It still runs on main (where the trend line is what matters) and can
    # be asked for on any branch via workflow_dispatch -- which is exactly
    # how #162's before/after numbers were taken.
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fetch the model once, in a single process, before the pool starts.
      # Without this the benchmark's three worker processes all cold-miss the
      # Hugging Face cache simultaneously and race writing the same file --
      # observed producing a truncated model and a "Protobuf parsing failed"
      # crash, not merely wasted bandwidth. The Docker image avoids this by
      # baking the weights in at build time (see apps/api/Dockerfile); this
      # job runs tsx directly, so it needs the equivalent step.
      - run: node apps/api/scripts/prefetch-tts-model.mjs
      - run: pnpm --filter @booklet/api exec tsx scripts/bench-tts-ttfa.ts

  docker-build:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      # Build only, no push -- this is here to catch exactly the kind of
      # thing that can't be caught by typecheck/lint/test: the production
      # build+run path (tsc/esbuild -> plain `node dist/index.js`, no tsx
      # or bundler doing module resolution favors at runtime) is a
      # different execution environment than dev or these other CI jobs,
      # and has broken silently before (see apps/api/scripts/build.mjs and
      # schema.prisma's importFileExtension for what that looked like).
      - run: docker build -f apps/api/Dockerfile -t booklet-api .
      - run: docker build -f apps/web/Dockerfile -t booklet-web .
      # Actually start the api image against a real throwaway Postgres and
      # hit its health route -- confirms the built image doesn't just exist,
      # it boots and Prisma actually connects.
      - name: Smoke-test the built API image
        run: |
          docker network create booklet-ci
          docker run -d --name booklet-postgres --network booklet-ci \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=booklet \
            postgres:16
          for i in $(seq 1 30); do
            docker exec booklet-postgres pg_isready -U postgres && break
            sleep 2
          done
          # A real random secret, not the placeholder the rest of this file
          # uses. This container runs the production image, so NODE_ENV is
          # production, and tokens.ts refuses known placeholders and anything
          # under 32 chars there (#174). Passing the placeholder makes the API
          # refuse to boot and the health check below time out -- the guard
          # working, reported as a mysterious CI failure. Whitelisting the
          # placeholder instead would make the guard theatre.
          SMOKE_SECRET=$(head -c 32 /dev/urandom | base64)
          docker run -d --name booklet-api --network booklet-ci -p 4000:4000 \
            -e DATABASE_URL="postgresql://postgres:postgres@booklet-postgres:5432/booklet?schema=public" \
            -e JWT_ACCESS_SECRET="$SMOKE_SECRET" \
            -e WEB_ORIGIN=http://localhost:3000 \
            booklet-api \
            sh -c "pnpm --filter @booklet/api exec prisma migrate deploy && node apps/api/dist/index.js"
          npx wait-on http://localhost:4000/api/health --timeout 60000
          curl -sf http://localhost:4000/api/health
          docker logs booklet-api

  test-extension-e2e:
    runs-on: [self-hosted, linux, x64]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booklet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booklet?schema=public
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @booklet/api exec prisma migrate deploy
      - run: pnpm --filter @booklet/extension build
      # Mozilla's own manifest validator -- catches Firefox-specific
      # manifest.json regressions (an unsupported strict_min_version for a
      # key actually in use, a missing required key like
      # data_collection_permissions) that nothing else here would, since
      # the e2e suite below only runs against Chromium.
      - run: pnpm --filter @booklet/extension lint:firefox
      - run: pnpm --filter @booklet/extension exec playwright install --with-deps chromium
      # Loading a real extension needs an actual background service worker,
      # which (confirmed empirically, see e2e/extension.spec.ts) doesn't
      # register under Chromium's headless mode -- xvfb gives it a real
      # display to run headed against, same trick used for any headed-only
      # browser suite on a runner with no physical display.
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: pnpm --filter @booklet/api dev &
      - name: Wait for the API to be ready
        run: npx wait-on http://localhost:4000/api/health --timeout 60000
      - run: xvfb-run -a pnpm --filter @booklet/extension test:e2e
