packages:
  - "apps/*"
  - "packages/*"
# Metro (the mobile app's bundler) doesn't reliably resolve relative
# imports through the NTFS junctions pnpm uses for directory links on
# Windows -- confirmed by hand: apps/mobile/node_modules/expo was a
# Junction (not a symlink), and Metro's unstable_enableSymlinks resolver
# option didn't traverse it correctly, so expo/AppEntry.js's own
# `import App from "../../App"` could never resolve. hoisted switches to a
# flat, real-directory node_modules layout (npm/yarn-classic style) with no
# junctions/symlinks at all, sidestepping the problem instead of fighting
# Metro's resolver further.
#
# Tradeoff: this affects dependency resolution for every workspace package,
# not just apps/mobile -- a package could now accidentally resolve an
# undeclared transitive dependency that happens to be hoisted (pnpm's
# default isolated linker is specifically what prevents that). The full
# test suite was re-run across every package after this change.
nodeLinker: hoisted
allowBuilds:
  '@prisma/engines': true
  # Both pulled in transitively by epubjs. core-js's postinstall is a
  # well-known, widely-documented sponsorship message printed to the
  # terminal (nothing else); es5-ext's is an equivalent no-op-for-behavior
  # informational script. Neither modifies anything outside node_modules.
  core-js: true
  es5-ext: true
  esbuild: true
  # Both pulled in transitively by kokoro-js (open-source client-side TTS,
  # see lib/reader/kokoro-tts.ts). onnxruntime-node's install script only
  # conditionally downloads CUDA binaries for Linux/x64 (irrelevant here --
  # inference runs via the browser/WASM backend, not this Node one) --
  # confirmed by reading node_modules/onnxruntime-node/script/install.js
  # directly. protobufjs's postinstall is just a version-scheme compat
  # warning check, no network access -- confirmed by reading
  # node_modules/protobufjs/scripts/postinstall.js directly.
  onnxruntime-node: true
  prisma: true
  protobufjs: true
  sharp: true
  # opencollective-postinstall -- a donation-nag message printed to the
  # terminal, nothing else (confirmed by reading node_modules/tesseract.js/
  # package.json directly). Needed for the OCR feature (pdf-extraction.ts).
  tesseract.js: true
  unrs-resolver: true

# One React for the whole JS workspace (#166). `nodeLinker: hoisted` above is
# what makes this necessary: with a flat node_modules there is one winner per
# package name at the root, and anything that cannot use it gets a nested copy
# instead. That left three React installs -- root, apps/web's own 19.2.4 pair,
# and apps/mobile's 19.0.0 -- including, at one point, a root react@19.0.0
# paired with react-dom@19.2.8, a combination React does not support at all.
#
# The visible cost was component tests. @testing-library/react ended up with
# its own nested react-dom, so rendering crossed two instances and failed as
# "Cannot read properties of null (reading 'useState')". Worth knowing how
# that presents: a component with no hooks renders fine across two copies, so
# a hookless test passes and proves nothing -- the first attempt here did
# exactly that before being retried against a component using useState.
#
# Pinned to apps/web's version rather than apps/mobile's 19.0.0 (which Expo /
# react-native 0.79 nominally wants) because web is where the rendering,
# testing and production traffic actually are. Both typecheck cleanly under
# it; the mobile runtime is not provable in this environment, and verifying
# real device builds is already tracked in #1 and #2. If Expo turns out to
# object at runtime, the alternative is pinning both to 19.0.0 -- Next 16
# accepts it -- rather than going back to three copies.
overrides:
  react: 19.2.4
  react-dom: 19.2.4
