# GitLab CI/CD -- the port of .github/workflows/ci.yml.
#
# This exists because the GitHub Actions allowance ran out mid-branch (see
# the "Cut what CI burns" commit), which left the repo with no automated
# checks at all. Every job below is a deliberate translation of its Actions
# counterpart rather than a fresh design, so the two can be compared
# side-by-side while both exist; the differences that aren't cosmetic are
# commented where they occur.
#
# The four translation hazards worth knowing about, all of which silently
# produce a broken-but-green (or mysteriously red) pipeline if missed:
#
#   1. Service hostnames. Actions maps a service container's ports onto
#      localhost; GitLab does not -- a service is reachable at its own
#      hostname on the shared network. Every DATABASE_URL here therefore
#      says `postgres:5432`, not `localhost:5432`.
#   2. Service readiness. Actions has `--health-cmd`; GitLab has no
#      equivalent and only waits for the port to open, which Postgres does
#      before it will actually answer queries. Hence the explicit readiness
#      wait in .wait_for_postgres below.
#   3. One shell per job. Actions runs each `run:` in a fresh shell but on a
#      persistent VM; GitLab runs the whole `script:` in one shell. This
#      makes backgrounding (`... &`) work more naturally here, but it also
#      means an early `cd` or exported variable leaks into later lines.
#   4. No sudo. The docker executor already runs as root, and `sudo` isn't
#      installed -- `sudo apt-get` from the Actions file becomes `apt-get`.
stages:
  - check
  - test
  - build

variables:
  # Dummy value -- signing access tokens is the only thing that reads this
  # in a way that matters for typecheck/lint/test, and none of those need a
  # real secret.
  JWT_ACCESS_SECRET: ci-test-secret-not-for-production
  # Every job triggers apps/api's postinstall (pnpm install runs it for the
  # whole workspace, not just jobs that filter to @booklet/api) -- prisma
  # generate resolves DATABASE_URL just to load prisma.config.ts, even
  # though pure codegen never connects. Jobs that need a real database
  # override this with the service hostname.
  DATABASE_URL: postgresql://user:password@localhost:5432/db?schema=public
  # Read by the postgres service image itself, in the jobs that declare it.
  # Harmless everywhere else: nothing reads them without that service.
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: booklet
  # Corepack prompts before downloading a pnpm it doesn't already have,
  # which on a non-interactive runner is an indefinite hang rather than a
  # failure. Opting out makes it just fetch the version pinned in the root
  # package.json's `packageManager` field.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  # pnpm's store lives in the project directory so `cache:` can actually
  # pick it up -- GitLab only caches paths inside the build directory, and
  # pnpm's default store is in $HOME, which is outside it.
  PNPM_STORE: .pnpm-store
  # Shallow clones are the default and are fine for every job here; nothing
  # below reads history. Kept explicit because the docker-build job's image
  # tagging uses $CI_COMMIT_SHORT_SHA, which does not need history either.
  GIT_DEPTH: "20"

# Superseded runs are cancelled instead of racing the new one to the finish.
# This is the single biggest lever on runner spend -- pushing five times in
# an afternoon used to mean five concurrent full runs, four of which nobody
# would ever read. `interruptible: true` is what makes a job eligible; the
# project setting "Auto-cancel redundant pipelines" (Settings > CI/CD >
# General pipelines) is what acts on it, and it is on by default.
#
# Deliberately NOT ported: the Actions workflow's `paths-ignore` for docs
# and markdown. GitLab's `rules:changes` means "run IF these paths changed",
# which cannot express "skip only if nothing BUT docs changed" -- the naive
# inversion skips the pipeline on any MR that touches a doc alongside real
# code, which is most of them. Silently not running CI on a real code change
# is a much worse failure than spending a runner on a prose-only MR, so this
# is left out until it can be done correctly.
default:
  image: node:22-bookworm
  interruptible: true
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - pnpm config set store-dir "$PNPM_STORE"
    - pnpm install --frozen-lockfile

workflow:
  rules:
    # Merge request pipelines.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Pushes to the default branch.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # "Run pipeline" from the UI or API -- the equivalent of Actions'
    # workflow_dispatch, and how bench-tts-ttfa gets asked for on a branch.
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # Any other branch push: only build if there is no open MR for it, so a
    # branch with an MR gets one pipeline instead of two identical ones.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS == null

# Postgres accepts TCP connections a moment before it will answer a query,
# and GitLab's own service wait only checks the former. Without this, the
# first `prisma migrate deploy` intermittently dies on a connection the
# server closes during startup -- the exact flake Actions' `--health-cmd
# pg_isready` was preventing there. Uses bash's /dev/tcp rather than
# pg_isready so it costs no apt install, then confirms readiness for real by
# letting the migrate itself retry.
.wait_for_postgres: &wait_for_postgres
  - |
    echo "Waiting for the postgres service to accept connections..."
    for i in $(seq 1 60); do
      if (exec 3<>/dev/tcp/postgres/5432) 2>/dev/null; then
        echo "postgres is listening (after ${i}s)"
        break
      fi
      sleep 1
    done
  - |
    echo "Applying migrations (retried -- see .wait_for_postgres)..."
    for i in 1 2 3 4 5; do
      if pnpm --filter @booklet/api exec prisma migrate deploy; then
        exit_ok=1
        break
      fi
      echo "migrate deploy attempt $i failed; postgres may still be starting up"
      sleep 3
    done
    test -n "$exit_ok"

.postgres_service: &postgres_service
  - name: postgres:16
    alias: postgres

typecheck-and-lint:
  stage: check
  script:
    - pnpm --filter @booklet/shared build
    - pnpm --filter @booklet/api exec tsc --noEmit
    - pnpm --filter @booklet/web exec tsc --noEmit
    - pnpm --filter @booklet/web lint
    - pnpm --filter @booklet/extension exec tsc --noEmit
    - pnpm --filter @booklet/mobile exec tsc --noEmit
    # The production bundle, without waiting for a Docker layer to say so.
    # tsc resolves imports through node_modules and never asks who *declared*
    # a package, so importing a transitive dependency typechecks cleanly and
    # then fails in esbuild -- which is exactly how a direct
    # @huggingface/transformers import broke docker-build with "No loader is
    # configured for '.node' files" while every other job stayed green.
    # docker-build still covers the full build+run path; this just moves the
    # cheapest half of that signal ~2 minutes earlier.
    - pnpm --filter @booklet/api exec node scripts/build.mjs

# Unit tests that need nothing but Node: @booklet/shared and apps/web.
test-unit:
  stage: test
  script:
    - pnpm --filter @booklet/shared test
    # apps/web's unit tests run here rather than in their own job: they need
    # no database, no browser and no built artifacts, and the whole suite is
    # ~2s -- a dedicated job would spend more time on checkout and install
    # than on the tests. See apps/web/vitest.config.ts for what they cover
    # and why the runner exists at all (#165).
    - pnpm --filter @booklet/shared build
    - pnpm --filter @booklet/web test

test-api:
  stage: test
  services: *postgres_service
  variables:
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/booklet?schema=public
    NODE_ENV: test
  script:
    # A real Postgres service, unlike the pglite dev database this repo also
    # supports -- so the normal Prisma migration engine (which doesn't
    # reliably talk to pglite) works fine here.
    - *wait_for_postgres
    - pnpm --filter @booklet/api test

test-web-e2e:
  stage: test
  # Only where the suite is actually runnable. On the Actions side this job
  # carried a hard `if: false` -- it was too slow to gate merges on, because
  # 31 specs each did a live network fetch plus a full extraction just as
  # setup. What made it viable again was the local article fixture server, so
  # gating on that file is the same decision expressed as a fact about the
  # tree rather than a flag someone has to remember to flip: branches without
  # it skip the job, and it switches itself on the moment the fixture server
  # merges. Confirmed the hard way -- this job was cherry-picked to a branch
  # that has none of it and failed on a missing module, which is the
  # bad-but-loud version of the same mismatch.
  rules:
    - exists:
        - apps/web/e2e/fixture-server/server.mjs
  # Playwright's own image rather than node + `playwright install
  # --with-deps`: the browser and its ~100 system packages are already
  # baked in, which is a couple of minutes of apt per run that this repo no
  # longer has the allowance to spend twice (here and in the extension job).
  # Tag must track @playwright/test in apps/web/package.json -- the install
  # below is a cheap no-op when they agree and a correct repair when a
  # lockfile bump makes them disagree, so a drifted tag costs seconds
  # instead of failing with "Executable doesn't exist".
  image: mcr.microsoft.com/playwright:v1.62.0-noble
  services: *postgres_service
  variables:
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/booklet?schema=public
    WEB_ORIGIN: http://localhost:3000
    NEXT_PUBLIC_API_URL: http://localhost:4000
    # Lets the API fetch the e2e fixture server on 127.0.0.1 instead of
    # every article-saving spec hitting the real internet. Guarded in
    # extraction-service.ts so it is ignored outright when
    # NODE_ENV=production -- the SSRF protection it relaxes is not
    # overridable where it matters.
    EXTRACTION_ALLOW_PRIVATE_ADDRESSES: "true"
    # The whole suite hits the API from one address in a couple of minutes,
    # which is precisely the pattern the default limit is meant to catch.
    # Without this it trips partway through and fails a spec that has
    # nothing wrong with it.
    GLOBAL_RATE_LIMIT_MAX: "100000"
    TTS_RATE_LIMIT_MAX: "100000"
  script:
    - *wait_for_postgres
    - pnpm --filter @booklet/web exec playwright install chromium
    # The API's three TTS workers all cold-miss the model cache at once and
    # race writing it, which produced a corrupt model and left read-aloud
    # non-functional for a whole run (tts-player.spec.ts timing out at 60s
    # waiting for playback). Fetch it once, single-process, first. See #161.
    - |
      # Belt-and-braces alongside the `exists` rules above: this script came
      # in with the TTS pool work, and a branch without it has no cache to
      # prime rather than a reason to fail.
      if [ -f apps/api/scripts/prefetch-tts-model.mjs ]; then
        node apps/api/scripts/prefetch-tts-model.mjs
      else
        echo "prefetch-tts-model.mjs is not on this branch -- skipping the model pre-fetch"
      fi
    - pnpm --filter @booklet/api dev &
    - pnpm --filter @booklet/web dev &
    - npx wait-on http://localhost:4000/api/health http://localhost:3000 --timeout 60000
    # Generate one small chunk before the suite starts, so the first TTS
    # spec doesn't pay the pool's cold start inside its own assertion
    # window. /api/health goes green while the pool is still spawning
    # workers and loading a model into each, and on a small runner already
    # busy with Next and Postgres that first generation can exceed the 60s
    # the spec allows. `|| true`: this is a warm-up, not a gate -- if it
    # fails the specs report it far more legibly than a bare curl exit code.
    - |
      curl -sS -X POST http://localhost:4000/api/tts \
        -H 'Content-Type: application/json' \
        -d '{"text":"Warming up.","voice":"af_heart","speed":1}' \
        --max-time 180 -o /dev/null -w 'warm-up HTTP %{http_code} in %{time_total}s\n' || true
    # Playwright starts the article fixture server itself (see
    # playwright.config.ts's webServer). Seven tests still reach the real
    # internet on purpose -- real-world extraction, xkcd's RSS feed,
    # dictionaryapi.dev and the Kokoro weights -- and every one of them is
    # tagged @live. If outbound network is ever restricted for this runner,
    # add `--grep-invert @live` here rather than dropping the whole job and
    # losing the other 110 tests with it. That exclusion is only trustworthy
    # because the tagging was made complete in #167; before that it named a
    # single spec while six others quietly needed egress too.
    - pnpm --filter @booklet/web test:e2e
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - apps/web/playwright-report/
      - apps/web/test-results/

test-extension-e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.62.0-noble
  services: *postgres_service
  variables:
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/booklet?schema=public
    WEB_ORIGIN: http://localhost:3000
  script:
    - *wait_for_postgres
    - pnpm --filter @booklet/extension build
    # Mozilla's own manifest validator -- catches Firefox-specific
    # manifest.json regressions (an unsupported strict_min_version for a key
    # actually in use, a missing required key like
    # data_collection_permissions) that nothing else here would, since the
    # e2e suite below only runs against Chromium.
    - pnpm --filter @booklet/extension lint:firefox
    - pnpm --filter @booklet/extension exec playwright install chromium
    # Loading a real extension needs an actual background service worker,
    # which (confirmed empirically, see e2e/extension.spec.ts) doesn't
    # register under Chromium's headless mode -- xvfb gives it a real
    # display to run headed against. No sudo: the docker executor is
    # already root. The Playwright image ships xvfb, so this is only a
    # fallback for a base-image change.
    - command -v xvfb-run >/dev/null || (apt-get update && apt-get install -y xvfb)
    - pnpm --filter @booklet/api dev &
    - npx wait-on http://localhost:4000/api/health --timeout 60000
    - xvfb-run -a pnpm --filter @booklet/extension test:e2e
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - apps/extension/playwright-report/
      - apps/extension/test-results/

bench-tts-ttfa:
  stage: test
  # Measures real Kokoro TTFA (cold pool, warm/uncached, cache hit,
  # concurrent chunks, prewarm head-start) -- see
  # apps/api/scripts/bench-tts-ttfa.ts. Needs real network access to fetch
  # Kokoro's weights from Hugging Face, and no Postgres -- the TTS pipeline
  # itself never touches the database.
  #
  # Not run on merge requests. It is a measurement, not a gate: it has no
  # pass/fail criteria, so an MR author gains nothing from it blocking or
  # from reading it on every push, while it costs a runner every time. It
  # still runs on the default branch (where the trend line is what matters)
  # and can be asked for on any branch by running the pipeline from the UI
  # -- which is exactly how #162's before/after numbers were taken.
  #
  # The `exists` clauses are not decoration: the benchmark script itself
  # arrived with the TTFA work, so on a branch predating it this job used to
  # fail on a missing module rather than sit out. A job that cannot run
  # should not exist, not fail.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists:
        - apps/api/scripts/bench-tts-ttfa.ts
    - if: $CI_PIPELINE_SOURCE == "web"
      exists:
        - apps/api/scripts/bench-tts-ttfa.ts
  script:
    # Fetch the model once, in a single process, before the pool starts.
    # Without this the benchmark's three worker processes all cold-miss the
    # Hugging Face cache simultaneously and race writing the same file --
    # observed producing a truncated model and a "Protobuf parsing failed"
    # crash, not merely wasted bandwidth. The Docker image avoids this by
    # baking the weights in at build time (see apps/api/Dockerfile); this
    # job runs tsx directly, so it needs the equivalent step.
    - |
      # Belt-and-braces alongside the `exists` rules above: this script came
      # in with the TTS pool work, and a branch without it has no cache to
      # prime rather than a reason to fail.
      if [ -f apps/api/scripts/prefetch-tts-model.mjs ]; then
        node apps/api/scripts/prefetch-tts-model.mjs
      else
        echo "prefetch-tts-model.mjs is not on this branch -- skipping the model pre-fetch"
      fi
    - pnpm --filter @booklet/api exec tsx scripts/bench-tts-ttfa.ts

docker-build:
  stage: build
  # Docker-in-Docker: the only job here that isn't a Node job. It gets the
  # docker CLI image plus a privileged dind service, which GitLab.com's
  # shared runners support; a self-hosted runner needs `privileged = true`
  # in its config.toml for this one job to work.
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  # The Node default above would fail here -- there is no pnpm in the docker
  # image and nothing in this job needs one; the build happens entirely
  # inside the Dockerfiles.
  before_script:
    - until docker info >/dev/null 2>&1; do echo "waiting for dind..."; sleep 1; done
  cache: []
  script:
    # Build only, no push -- this is here to catch exactly the kind of thing
    # that can't be caught by typecheck/lint/test: the production build+run
    # path (tsc/esbuild -> plain `node dist/index.js`, no tsx or bundler
    # doing module resolution favors at runtime) is a different execution
    # environment than dev or these other CI jobs, and has broken silently
    # before (see apps/api/scripts/build.mjs and schema.prisma's
    # importFileExtension for what that looked like).
    - docker build -f apps/api/Dockerfile -t booklet-api .
    - docker build -f apps/web/Dockerfile -t booklet-web .
    # Actually start the api image against a real throwaway Postgres and hit
    # its health route -- confirms the built image doesn't just exist, it
    # boots and Prisma actually connects.
    - docker network create booklet-ci
    - |
      docker run -d --name booklet-postgres --network booklet-ci \
        -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=booklet \
        postgres:16
    - |
      for i in $(seq 1 30); do
        docker exec booklet-postgres pg_isready -U postgres && break
        sleep 2
      done
    # --network booklet-ci rather than a published port: the docker daemon
    # is a *separate container* here (dind), so a -p published port lands on
    # the daemon's network namespace, not this job's. Curling from a
    # throwaway container on the same network is the portable equivalent of
    # Actions' `wait-on http://localhost:4000`.
    - |
      docker run -d --name booklet-api --network booklet-ci \
        -e DATABASE_URL="postgresql://postgres:postgres@booklet-postgres:5432/booklet?schema=public" \
        -e JWT_ACCESS_SECRET=ci-test-secret-not-for-production \
        -e WEB_ORIGIN=http://localhost:3000 \
        booklet-api \
        sh -c "pnpm --filter @booklet/api exec prisma migrate deploy && node apps/api/dist/index.js"
    - |
      for i in $(seq 1 60); do
        if docker run --rm --network booklet-ci curlimages/curl:8.11.1 \
             -sf http://booklet-api:4000/api/health; then
          echo "API image is healthy"
          healthy=1
          break
        fi
        sleep 2
      done
      docker logs booklet-api
      test -n "$healthy"
    # The CD half, as far as it can honestly go today -- and deliberately in
    # *this* job rather than a second one.
    #
    # A separate publish job would have to rebuild both images from scratch:
    # dind gives every job a brand-new daemon with an empty layer cache, so
    # nothing built above survives into another job. These Dockerfiles bake
    # the Kokoro weights in at build time, which makes that a genuinely
    # expensive thing to do twice per push to main -- and an exhausted CI
    # allowance is what started this migration. Tagging and pushing the
    # images already built and already smoke-tested here costs nothing extra.
    #
    # It stops at the registry on purpose. DEPLOYMENT.md is explicit that no
    # cloud account exists and nothing has ever actually been deployed, so
    # there is no host, no credentials and no verified runbook to deploy
    # *to*; inventing a target would produce a job that has never run and
    # cannot be tested. Pushing here needs no external account (GitLab
    # injects CI_REGISTRY_* itself) and is the step every real deploy target
    # consumes, so it is the piece worth having now. The actual deploy is
    # then one job that pulls these tags.
    #
    # Default branch only: a registry tag per feature-branch push is storage
    # nobody asked for. These are release artifacts, not build debris.
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        for app in api web; do
          docker tag "booklet-$app" "$CI_REGISTRY_IMAGE/$app:$CI_COMMIT_SHORT_SHA"
          docker tag "booklet-$app" "$CI_REGISTRY_IMAGE/$app:latest"
          docker push "$CI_REGISTRY_IMAGE/$app:$CI_COMMIT_SHORT_SHA"
          docker push "$CI_REGISTRY_IMAGE/$app:latest"
        done
      else
        echo "Not the default branch -- images built and smoke-tested, not published."
      fi
