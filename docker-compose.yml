# Local "production-like" stack: real Postgres + the two Dockerfiles, all
# on one network. Not what you'd run in actual production (no TLS, no
# secrets manager, a single Postgres instance with no backups) -- this is
# for testing the images themselves, and as a starting point for whatever
# orchestration you actually deploy with.
#
# `docker compose up --build` itself is still unverified in this specific
# environment (Docker Desktop installed but its daemon needs WSL2, which
# isn't -- installing it needs a restart, out of scope to do unilaterally).
# What is verified: apps/api/Dockerfile's actual build+run path (see that
# file's own header comment) directly, by running the equivalent commands
# without Docker in between; and both Dockerfiles building, plus the api
# image actually booting against a real Postgres and answering a request, in
# CI's docker-build job (.github/workflows/ci.yml), which runs on a
# self-hosted runner -- see DEPLOYMENT.md's "CI: the self-hosted runner" and
# docs/CI_GITHUB_RUNNER.md. Until a runner is registered and Idle, nothing is
# re-verifying this automatically; `pnpm verify` is the local stand-in.
#
#   cp apps/api/.env.example apps/api/.env.docker   # fill in JWT_ACCESS_SECRET etc.
#   docker compose up --build

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booklet
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Shared cache for generated speech (apps/api/src/services/tts-cache.ts).
  # Optional everywhere -- the API drops to its in-process cache when
  # REDIS_URL is unset -- but included here because this stack exists to
  # mirror a real deployment, and without it every restart re-pays the
  # multi-second generation cost for audio that was already produced.
  #
  # allkeys-lru with a real maxmemory rather than the default noeviction:
  # audio entries are pure cache with a long TTL, so the correct behavior
  # under pressure is to drop the coldest ones, not to start refusing
  # writes (which is what noeviction does once memory fills).
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/booklet?schema=public
      REDIS_URL: redis://redis:6379
      PORT: "4000"
      WEB_ORIGIN: http://localhost:3000
      API_ORIGIN: http://localhost:4000
      NODE_ENV: production
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set a real secret -- see .env.example}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Repeated from apps/api/Dockerfile's own ENV, not relied upon from it:
      # the volume below and the path the app writes to have to be the same
      # string, and a reader of this file should be able to see that without
      # opening the Dockerfile. Change one and you must change both.
      FILE_STORAGE_PATH: /var/lib/booklet/storage
    # Uploaded PDFs/EPUBs and generated podcast enclosures. Named, exactly
    # like postgres-data and redis-data, because it holds the same kind of
    # thing they do: the only copy of something a user gave us. Without it,
    # `docker compose up --build` after a code change silently destroys every
    # uploaded book while its database row survives, pointing at bytes that
    # are gone (#173) -- and since #172 clears the browser's IndexedDB copy
    # once the server has the file, the server's copy is the only one left.
    volumes:
      - storage-data:/var/lib/booklet/storage
    # /api/ready, not /api/health: health is liveness (the process is running)
    # and answers ok on an instance whose every real request 500s because
    # Postgres is unreachable. Ready runs SELECT 1, so an instance that cannot
    # serve anything is marked unhealthy instead of being treated as a working
    # one -- which is what makes a rolling deploy stop rather than drain the
    # last good instance. Fetched with node because the runtime image has no
    # curl or wget; node is by definition present.
    #
    # start_period covers `prisma migrate deploy`, which runs before the
    # server starts (see command below) and takes as long as the pending
    # migrations take on a real dataset -- failures inside it do not count
    # against retries.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Prisma's migrate deploy (not migrate dev -- no shadow DB, no
    # interactive prompts, the right one for a real deployment) before
    # starting the server. The api image's build stage copies the whole
    # repo (see apps/api/Dockerfile), so pnpm and the prisma CLI are both
    # still present at runtime for this.
    command: sh -c "pnpm --filter @booklet/api exec prisma migrate deploy && node apps/api/dist/index.js"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Build args, not `environment` -- Next inlines NEXT_PUBLIC_* into the
      # client bundle at build time, so setting these at run time is too late
      # to reach the browser (see DEPLOYMENT.md and the Dockerfile's ARGs).
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  storage-data:
