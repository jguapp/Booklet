<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Booklet</title>
    <style>
      :root {
        /* Same palette as the web app's light theme (globals.css) -- kept in
           sync by hand since this is a plain static popup, not Tailwind. */
        --color-paper: #EDEBE2;
        --color-surface: #FAF9F4;
        --color-surface-2: #F3F1E9;
        --color-ink: #211F1A;
        --color-ink-muted: #5C584D;
        --color-ink-faint: #86816F;
        --color-border: #DBD6C8;
        --color-accent: #1F6F6B;
        --color-accent-strong: #14514E;
        --color-accent-contrast: #FBFAF6;
        --font-serif: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
        --font-sans: -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 300px;
        margin: 0;
        padding: 20px;
        font-family: var(--font-sans);
        background: var(--color-paper);
        color: var(--color-ink);
      }

      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 18px;
      }

      .logo {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        background: var(--color-accent);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .logo svg {
        width: 16px;
        height: 16px;
      }

      h1 {
        font-family: var(--font-serif);
        font-size: 18px;
        font-weight: 600;
        margin: 0;
        letter-spacing: -0.01em;
      }

      label {
        display: block;
        font-family: var(--font-sans);
        font-size: 12px;
        font-weight: 500;
        color: var(--color-ink-muted);
        margin-bottom: 5px;
      }

      label + label {
        margin-top: 12px;
      }

      input {
        width: 100%;
        padding: 8px 10px;
        margin-bottom: 4px;
        border: 1px solid var(--color-border);
        border-radius: 6px;
        background: var(--color-surface);
        color: var(--color-ink);
        font-size: 13px;
        font-family: var(--font-sans);
        transition: border-color 0.15s, box-shadow 0.15s;
      }

      input:focus {
        outline: none;
        border-color: var(--color-accent);
        box-shadow: 0 0 0 3px rgba(31, 111, 107, 0.18);
      }

      input::placeholder {
        color: var(--color-ink-faint);
      }

      button {
        width: 100%;
        padding: 9px;
        border: none;
        border-radius: 6px;
        background: var(--color-accent);
        color: var(--color-accent-contrast);
        font-size: 13px;
        font-weight: 600;
        font-family: var(--font-sans);
        cursor: pointer;
        transition: background 0.15s, opacity 0.15s;
      }

      button:hover:not(:disabled) {
        background: var(--color-accent-strong);
      }

      button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      button.secondary {
        background: transparent;
        color: var(--color-ink-muted);
        border: 1px solid var(--color-border);
        padding: 6px 10px;
        width: auto;
        font-weight: 500;
      }

      button.secondary:hover:not(:disabled) {
        background: var(--color-surface-2);
        color: var(--color-ink);
      }

      button.submit {
        margin-top: 10px;
      }

      p.status {
        font-size: 12px;
        color: var(--color-ink-faint);
        margin: 10px 0 0;
        line-height: 1.5;
      }

      p.error {
        color: #B5502F;
      }

      p.footnote {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--color-border);
      }

      .account-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 16px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--color-border);
      }

      .account-info {
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
      }

      .account-label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--color-ink-faint);
      }

      .account-email {
        font-size: 13px;
        font-weight: 500;
        color: var(--color-ink);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path
            d="M12 8.2c-1.1-.9-2.6-1.3-4.2-1.3-.4 0-.7.3-.7.7v7.6c0 .4.3.7.7.7 1.6 0 3.1.4 4.2 1.3 1.1-.9 2.6-1.3 4.2-1.3.4 0 .7-.3.7-.7V7.6c0-.4-.3-.7-.7-.7-1.6 0-3.1.4-4.2 1.3Z"
            stroke="#FBFAF6"
            stroke-width="1.4"
            stroke-linejoin="round"
          />
          <path d="M12 8.2v8.3" stroke="#FBFAF6" stroke-width="1.4" stroke-linecap="round" />
        </svg>
      </div>
      <h1>Booklet</h1>
    </div>
    <div id="root"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
